# Publishing the portal on Render.
#
# The portal is static: the build runs the interface commands and nothing else,
# and there is no live server in production. Two things follow. The idle-sleep
# limit of the free plan does not apply to static files. And the data has to sit
# in the repository already built, because the build runs no Python and will
# produce no artefacts.
#
# The rewrite rule is what client-side routing needs: without it a direct
# request to /registry or /tech/pathrag would return no page, and permanent
# addresses for the record pages are a precondition of being citable.
#
# IMPORTANT. This file takes effect only when the service was created through a
# Blueprint ("New +" then "Blueprint"). A service created by hand as a Static
# Site reads only the build command from the repository: neither the rewrite
# rules nor the headers here apply to it, and that is discovered not at deploy
# time but when a reader opens a link to a record and gets a 404.
#
# It has happened already: every internal address of the portal answered with no
# page while the data files were served correctly, because they need no rule.
# If the service was created by hand, the same rule is added on the
# Redirects/Rewrites tab: source /*, destination /index.html, action Rewrite.
#
# `make smoke` checks this: it opens a direct link to a record page.

services:
  - type: web
    runtime: static
    name: rag-world
    plan: free
    rootDir: ui
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The data artefacts change with every update pass, so they are cached
      # briefly: otherwise a reader sees last week's state and cannot tell why.
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# Публикация портала на Render.
#
# Портал статический: сборка выполняет только команды интерфейса, живого сервера
# в продакшене нет. Отсюда два следствия. Первое: ограничение на засыпание при
# простое к статике не относится. Второе: данные обязаны лежать в репозитории
# собранными — сборка не запускает Python и артефакты не породит.
#
# Правило переписывания адресов нужно клиентской маршрутизации: без него прямое
# обращение к /registry или /tech/pathrag вернуло бы отсутствие страницы, а
# постоянные адреса карточек — обязательное условие цитируемости.
#
# ВАЖНО. Этот файл действует, только если сервис создан через Blueprint
# («New +» → «Blueprint»). Сервис, заведённый вручную как Static Site, читает
# из репозитория лишь команду сборки: ни правила переписывания, ни заголовки
# отсюда к нему не применяются, и обнаруживается это не при развёртывании, а
# когда читатель открывает ссылку на карточку и получает 404.
#
# Так уже случилось: все внутренние адреса портала отвечали отсутствием
# страницы, а файлы данных при этом отдавались исправно — потому что к ним
# правило и не нужно. Если сервис заведён вручную, то же правило добавляется
# на вкладке Redirects/Rewrites: источник /*, назначение /index.html,
# действие Rewrite.
#
# Проверяется это `make smoke`: там есть проверка прямой ссылки на карточку.

services:
  - type: web
    runtime: static
    name: rag-world
    plan: free
    rootDir: ui
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Артефакты данных обновляются ежедневно, поэтому кэшируются ненадолго:
      # иначе читатель увидит вчерашнее состояние и не поймёт почему.
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

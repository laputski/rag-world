# Мутационный прогон: порча каждого правила по очереди.
#
# Отвечает на вопрос, которого не задаёт покрытие: заметит ли поломку правила
# хоть один тест. Разница не умозрительная. У проверки данных покрытие было
# 48 процентов, а отключение любой её проверки по одной оставляло весь набор
# зелёным двадцать один раз подряд.
#
# Живёт отдельно от проверок при каждой правке, потому что идёт около двадцати
# пяти минут. Вешать это на каждый пуш значило бы получить проверку, которую
# начнут обходить.
#
# Недельного шага достаточно: перечень портится не от времени, а от правок
# кода, и его годность (совпадает ли образец записи с нынешним кодом)
# проверяется обычным набором при каждой правке, там же, где она и ломается.
# Сюда остаётся собственно прогон.
#
# Логики здесь нет: вызывается тот же скрипт, который человек запускает
# командой `make mutate`.

name: Мутационный прогон

on:
  schedule:
    # По четвергам в 05:00 UTC. Отдельно от сбора данных (понедельник), чтобы
    # два долгих задания не сходились в одном дне.
    - cron: "0 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    # Прогон местами упирался в двадцать пять минут; запас взят на рост
    # перечня, но не бесконечный: зависшее задание должно падать, а не жить.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Порча правил по одному
        run: python scripts/mutate.py

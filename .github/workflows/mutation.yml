# Mutation run: each rule broken in turn.
#
# It answers the question coverage does not ask — would any test notice if a
# rule stopped working. The difference is not hypothetical. Data validation had
# 48 percent coverage, and disabling any one of its checks left the whole suite
# green, twenty-one times in a row.
#
# It lives apart from the per-change checks because it takes about twenty-five
# minutes. Hanging that on every push would produce a check people learn to
# route around.
#
# A weekly cadence is enough: the catalogue decays from code edits, not from
# time, and whether an entry still applies (does its pattern still match the
# current code) is checked by the ordinary suite on every change, in the same
# place where it breaks. What remains here is the run itself.
#
# No logic lives here: it invokes the same script a person runs with
# `make mutate`.

name: Mutation run

on:
  schedule:
    # Thursdays at 05:00 UTC. Kept away from the data collection run (Monday)
    # so two long jobs do not land on the same day.
    - cron: "0 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    # The run has come close to twenty-five minutes; the allowance leaves room
    # for the catalogue to grow, but not unbounded room: a hung job should fail
    # rather than live on.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Break each rule in turn
        run: python scripts/mutate.py

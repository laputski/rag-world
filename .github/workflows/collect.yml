# Обновление данных по расписанию: то, ради чего портал называется
# самообновляемым.
#
# В этом файле нет логики намеренно. Он вызывает те же цели Makefile, которыми
# пользуется человек, поэтому поведение автономного прогона совпадает с
# локальным по построению, а всё, что решает вопросы, лежит в scripts/ и
# покрыто тестами.
#
# Периодичность недельная. Ежедневный сбор был бы тратой: обходятся ссылки уже
# известных записей, шага обнаружения новых технологий нет, поэтому ежедневный
# проход почти всегда возвращает то же самое. Меняется немногое и небыстро:
# цитирования — медленно, состояние репозиториев — в масштабе недель, переход
# препринта в конференционную публикацию — месяцев. Последнее и есть то, ради
# чего стоит опрашивать регулярно.

name: Обновление данных

on:
  schedule:
    # По понедельникам в 04:40 UTC. Время приблизительное: площадка задерживает
    # запуск на пять–тридцать минут при нагрузке, для недельного шага неважно.
    - cron: "40 4 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Обработать только одну запись (идентификатор)"
        required: false
      limit:
        description: "Ограничить число записей"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Два прохода одновременно писали бы в одни и те же файлы.
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Сбор, пересчёт уровней, сборка артефактов, проверка и запись прогона —
      # одной целью. Ровно её же запускает человек командой `make collect`.
      # Проверка данных выполняется внутри прохода и до фиксации: коммит бота
      # не запускает другие рабочие процессы, поэтому «проверим потом в CI» не
      # сработает.
      - name: Проход обновления
        env:
          # Токен выдаётся заданию автоматически; ключи прочих источников не
          # нужны — архив препринтов и открытый индекс работают без них.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update.py \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # Строка журнала прогонов появляется всегда, поэтому изменения есть после
      # каждого прохода. Это не шум: она отличает «никто не смотрел» от «ничего
      # не происходило» и служит признаком активности репозитория — расписание
      # площадки отключается после шестидесяти дней без коммитов.
      - name: Требуется ли рассмотрение человеком
        id: gate
        run: python scripts/classify_changes.py --github >> "$GITHUB_OUTPUT"

      - name: Зафиксировать изменения
        if: steps.gate.outputs.review == 'false'
        run: |
          git config user.name "rag-world-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data ui/public/data
          git diff --cached --quiet && echo "изменений нет" && exit 0
          git commit -m "Данные: проход обновления $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Открыть запрос на слияние
        if: steps.gate.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="data/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "rag-world-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add data ui/public/data
          git commit -m "Данные: изменения, требующие рассмотрения"
          git push -u origin "$branch"
          gh pr create --fill \
            --title "Данные: изменения, требующие рассмотрения" \
            --body "Изменение затрагивает понижение уровня, переход через границу подтверждённости либо свидетельство, введённое человеком. Такие изменения применяются только после просмотра."

# The scheduled data update: the thing that makes the portal self-updating.
#
# This file contains no logic, deliberately. It invokes the same Makefile
# targets a person uses, so what the unattended run does matches what a local
# run does by construction, and everything that makes a decision lives in
# scripts/ where tests can reach it.
#
# The cadence is weekly. Daily collection would be waste: the run walks the
# links of records already known, there is no discovery of new work in it, so a
# daily pass almost always returns the same thing. Little changes and nothing
# changes fast: citations move slowly, repository state on the scale of weeks,
# a preprint becoming a conference paper on the scale of months. That last one
# is what makes regular polling worth doing at all.

name: Data update

on:
  schedule:
    # Mondays at 04:40 UTC. The time is approximate: the platform delays a
    # scheduled start by five to thirty minutes under load, which does not
    # matter at a weekly cadence.
    - cron: "40 4 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Process a single record (identifier)"
        required: false
      limit:
        description: "Cap the number of records"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Two passes at once would write to the same files.
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Collection, level recomputation, artefact rebuild, validation and the
      # run-log line, in one target. The same one a person runs with
      # `make collect`. Validation happens inside the pass and before anything
      # is committed: a bot commit does not trigger other workflows, so
      # "we will check it later in CI" would never happen.
      - name: Update pass
        env:
          # The token is issued to the job automatically; no other source needs
          # a key — the preprint archive and the open index work without one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The open index keeps a polite request pool for those who give a
          # contact address, with noticeably higher limits. The secret is
          # optional: without it the run works, just slower and at risk of
          # hitting a rate refusal.
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          python scripts/update.py \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: Does this need human review
        id: gate
        run: python scripts/classify_changes.py --github >> "$GITHUB_OUTPUT"

      # The run-log line reaches the main branch **always**, including when the
      # data itself went for review. It is not a claim about a technology but a
      # fact: the pass happened, the sources were polled. There is nothing in it
      # to review.
      #
      # Keeping it together with the data was a mistake, and an expensive one. A
      # pass that went to review left nothing on the main branch, and those are
      # exactly the passes that happen in interesting weeks. Two things broke,
      # both silently: the platform disables a schedule after sixty days without
      # commits, and a reader tells "nobody looked" from "nothing happened" by
      # the date of the last check — a frozen date tells them the first when the
      # second is true.
      - name: Record the pass on the main branch
        run: |
          git config user.name "rag-world-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/collection_log.jsonl
          git diff --cached --quiet || git commit -m "chore(data): pass $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Commit the changes
        if: steps.gate.outputs.review == 'false'
        run: |
          git add data ui/public/data
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "chore(data): update pass $(date -u +%Y-%m-%d) [skip ci]"
          git push

      # The branch grows from the already-committed pass, so the run-log line
      # does not enter it a second time and the merge does not hit a conflict.
      - name: Open a pull request
        if: steps.gate.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="data/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$branch"
          git add data ui/public/data
          git commit -m "chore(data): changes that need review"
          git push -u origin "$branch"
          gh pr create --fill \
            --title "Data: changes that need review" \
            --body "This pass touches a demotion, a crossing of the confirmed-evidence boundary, or evidence entered by a human. Such changes apply only after review. The run-log line is already on the main branch: the pass happened, only its conclusions are under review."

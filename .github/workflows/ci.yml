# Checks that run on every change to code or data.
#
# The file deliberately contains no logic: everything it does is invoke Makefile
# targets, the same ones a person uses. Because of that, what the automated
# checks do matches what a local run does by construction, rather than by
# someone remembering to keep two lists in step.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python and data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check core services scripts tests
      - name: Tests
        run: pytest tests/ -q
      # Schema, referential integrity and provenance of every number. No network
      # is touched: these checks have to pass with the network fully down, or
      # the portal could not be built offline.
      - name: Validate data
        run: python scripts/validate_data.py

  ui:
    name: Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ui
      - name: Types and build
        run: npm run build
        working-directory: ui
      - name: Portal tests
        run: npm test
        working-directory: ui

# Проверки при изменении кода и данных.
#
# Файл создан заранее и до переезда репозитория на GitHub не выполняется. Он
# намеренно не содержит логики: всё, что он делает, — вызывает цели Makefile,
# те же самые, которыми пользуется человек. Благодаря этому поведение проверок
# в автономном режиме совпадает с локальным по построению.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python и данные
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Проверка кода
        run: ruff check core services scripts tests
      - name: Тесты
        run: pytest tests/ -q
      # Схема, разрешимость ссылок и происхождение чисел. Обращений к сети нет:
      # проверки обязаны проходить при её полной недоступности, иначе портал
      # нельзя собрать без интернета.
      - name: Проверка данных
        run: python scripts/validate_data.py

  ui:
    name: Интерфейс
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Установка
        run: npm ci
        working-directory: ui
      - name: Типы и сборка
        run: npm run build
        working-directory: ui
      - name: Тесты интерфейса
        run: npm test
        working-directory: ui

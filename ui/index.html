<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The title, the description and the canonical address are set statically
      here and rewritten as the reader moves between pages (see
      `useDocumentHead`). The static values are needed because the portal is
      assembled in the browser: a crawler that runs no code sees only what
      stands here. The default language is English, as it is for the portal.
    -->
    <title>RAG World — registry of retrieval-augmented generation technologies</title>
    <meta
      name="description"
      content="A self-updating registry of retrieval-augmented generation technologies. Every record carries a configuration over a stratified schema, a maturity level derived by a deterministic rule from collected evidence, and the evidence itself. Published as open JSON under CC BY."
    />
    <link rel="canonical" href="https://ragworld.org/" />

    <!--
      Keywords. The major search engines have ignored them since 2009 and say
      so plainly, so they affect no ranking. They are kept because dataset
      catalogues and some domain crawlers do read them, and they cost one line.
      No number goes in here: a description that carries a count of records
      goes stale by the next pass.
    -->
    <meta
      name="keywords"
      content="retrieval-augmented generation, RAG, RAG architectures, information retrieval, dense retrieval, hybrid search, reranking, knowledge graph, GraphRAG, vector search, embeddings, technology readiness, maturity scale, configuration space, feature model, open dataset"
    />

    <!--
      The tab icon is vector and single for both themes: the palette is chosen
      inside the file from the browser theme. A raster icon cannot do that, and
      the palette would have to be chosen on the reader's behalf, leaving the
      mark dim on half the devices. The home-screen icon is raster, because a
      vector one is not accepted there.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RAG World" />
    <meta property="og:title" content="RAG World — registry of retrieval-augmented generation technologies" />
    <meta
      property="og:description"
      content="RAG technologies mapped to a stratified configuration schema, with maturity derived by rule from evidence rather than by opinion. Updated weekly. Open data."
    />
    <meta property="og:url" content="https://ragworld.org/" />
    <meta property="og:image" content="https://ragworld.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RAG World: a configuration fingerprint over seven strata" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="color-scheme" content="dark light" />

    <link rel="alternate" type="application/rss+xml" title="RAG World" href="/data/feed.xml" />
    <!--
      The dataset index is declared as a link rather than merely mentioned in
      the text, so that it is found both by a consumer reading the markup and by
      one reading llms.txt.
    -->
    <link rel="alternate" type="application/json" title="RAG World datasets" href="/data/index.json" />

    <!--
      Dataset markup after schema.org. What the portal publishes is a dataset,
      not an article and not a program, and a declaration of that kind is what
      search engines and data catalogues rely on.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "RAG World registry",
        "description": "A registry of retrieval-augmented generation technologies. Each record carries a configuration over a 28-dimension stratified schema, a maturity level from L0 to L6 derived by a deterministic rule with no language model involved, and the evidence records that level stands on. Collected weekly from arXiv, OpenAlex, GitHub, PyPI and Papers with Code.",
        "url": "https://ragworld.org/",
        "sameAs": "https://github.com/laputski/rag-world",
        "license": "https://creativecommons.org/licenses/by/4.0/",
        "isAccessibleForFree": true,
        "creator": { "@type": "Organization", "name": "RAG World", "url": "https://ragworld.org/" },
        "keywords": [
          "retrieval-augmented generation",
          "RAG",
          "information retrieval",
          "technology readiness",
          "configuration space",
          "knowledge graph"
        ],
        "distribution": [
          {
            "@type": "DataDownload",
            "name": "Registry",
            "encodingFormat": "application/json",
            "contentUrl": "https://ragworld.org/data/registry.json"
          },
          {
            "@type": "DataDownload",
            "name": "Dataset index",
            "encodingFormat": "application/json",
            "contentUrl": "https://ragworld.org/data/index.json"
          },
          {
            "@type": "DataDownload",
            "name": "Change feed",
            "encodingFormat": "application/rss+xml",
            "contentUrl": "https://ragworld.org/data/feed.xml"
          }
        ]
      }
    </script>
  </head>
  <body>
    <!--
      Yandex.Metrika. The counter stands here rather than inside the interface
      code so that it is loaded even when the bundle fails, and so that the
      readers who run no code are still counted by the picture in `noscript`.

      It counts one visit on load, and the portal is assembled in the browser:
      moving between the sections changes no document and would otherwise be
      invisible. The visits that follow are sent from `useMetrikaHit`, and the
      number of the counter is written down in both places — one here, one
      there — because a script in the markup shares nothing with the module.
    -->
    <script type="text/javascript">
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=111641296', 'ym');

        ym(111641296, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
    </script>
    <noscript><div><img src="https://mc.yandex.ru/watch/111641296" style="position:absolute; left:-9999px;" alt="" /></div></noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

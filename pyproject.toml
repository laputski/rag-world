[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-world"
version = "0.2.0"
description = "RAG World: a self-updating registry and maturity map of RAG technologies."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alexander Laputski" }]
keywords = [
    "retrieval-augmented-generation",
    "information-retrieval",
    "technology-readiness",
    "configuration-space",
    "open-data",
]

dependencies = [
    "pydantic>=2.7",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://ragworld.org"
Repository = "https://github.com/laputski/rag-world"
Dataset = "https://ragworld.org/data/index.json"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Разбор описаний рабочих процессов в проверке «в задании нет логики».
    # Локально он приходил попутно с другим пакетом, поэтому его отсутствие
    # обнаружилось только на чистой установке в непрерывной интеграции.
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["core*", "services*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Дымовые проверки развёрнутого портала требуют сети и проверяют не код, а
# результат развёртывания. В основной набор они не входят: тест, падающий
# из-за чужой сети, перестают читать вместе со всеми остальными.
addopts = "-q -m 'not network'"
markers = [
    "network: требует сети; в основной набор не входит (см. tests/smoke)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

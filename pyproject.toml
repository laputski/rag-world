[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-world"
version = "0.2.0"
description = "RAG World: самообновляемый реестр и карта зрелости технологий RAG."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Нужен только для разовой миграции реестра из локальной базы в файлы data/.
migration = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["core*", "services*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Дымовые проверки развёрнутого портала требуют сети и проверяют не код, а
# результат развёртывания. В основной набор они не входят: тест, падающий
# из-за чужой сети, перестают читать вместе со всеми остальными.
addopts = "-q -m 'not network'"
markers = [
    "network: требует сети; в основной набор не входит (см. tests/smoke)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-world"
version = "0.2.0"
description = "RAG World: a self-updating registry and maturity map of RAG technologies."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alexander Laputski" }]
keywords = [
    "retrieval-augmented-generation",
    "information-retrieval",
    "technology-readiness",
    "configuration-space",
    "open-data",
]

dependencies = [
    "pydantic>=2.7",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://ragworld.org"
Repository = "https://github.com/laputski/rag-world"
Dataset = "https://ragworld.org/data/index.json"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Parses workflow descriptions for the check that a job holds no logic.
    # Locally it arrived as another package's dependency, so its absence showed
    # up only on a clean install in continuous integration.
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["core*", "services*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The smoke checks of the deployed portal need a network and test the result of
# a deployment rather than the code. They stay out of the main suite: a test that
# fails because of somebody else's network stops being read, and the rest of the
# suite stops being read along with it.
addopts = "-q -m 'not network'"
markers = [
    "network: needs a network; outside the main suite (see tests/smoke)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
